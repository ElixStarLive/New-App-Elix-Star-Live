# NEW app iOS — Codemagic only (no local Xcode on Windows).
# Bundle: com.elixstarlive.app · Team: 74Y7WAZVUV
# Capacitor 8 SPM project: ios/App/App.xcodeproj (no CocoaPods workspace).
# Signing / TestFlight: Codemagic iOS signing + group app_store_credentials.

workflows:
  ios-unsigned:
    name: iOS compile check (unsigned)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web + sync Capacitor iOS
        script: npm run build:ios
      - name: Xcode build (no signing)
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log

  ios-signed-ipa:
    name: iOS signed IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.elixstarlive.app
      node: 22
      xcode: latest
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.elixstarlive.app
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web + sync Capacitor iOS
        script: npm run build:ios
      - name: Set up keychain + code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles --code-signing-setup-verbose-logging
      - name: Increment iOS build number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER))
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist /Users/builder/export_options.plist \
            --archive-flags="-destination 'generic/platform=iOS' CODE_SIGN_IDENTITY='Apple Distribution' CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=74Y7WAZVUV"
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.elixstarlive.app
      groups:
        - app_store_credentials
      node: 22
      xcode: latest
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.elixstarlive.app
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web + sync Capacitor iOS
        script: npm run build:ios
      - name: Set up keychain + code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles --code-signing-setup-verbose-logging
      - name: Increment iOS build number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER))
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist /Users/builder/export_options.plist \
            --archive-flags="-destination 'generic/platform=iOS' CODE_SIGN_IDENTITY='Apple Distribution' CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=74Y7WAZVUV"
      - name: Upload IPA to TestFlight
        script: |
          set -e
          IPA_PATH="$(ls build/ios/ipa/*.ipa ios/App/build/ios/ipa/*.ipa 2>/dev/null | head -n 1)"
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA found"
            exit 1
          fi
          export APP_STORE_CONNECT_KEY_ID="${APP_STORE_CONNECT_KEY_IDENTIFIER:-${APP_STORE_CONNECT_KEY_ID:-}}"
          export APP_STORE_CONNECT_KEY_IDENTIFIER="$APP_STORE_CONNECT_KEY_ID"
          if [ -z "${APP_STORE_CONNECT_KEY_ID:-}" ] || [ -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ] || [ -z "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ]; then
            echo "ERROR: app_store_credentials group missing KEY_ID, ISSUER_ID, or PRIVATE_KEY"
            exit 1
          fi
          python3 - <<'PY'
          import os, re, pathlib, base64, sys
          key_id = os.environ["APP_STORE_CONNECT_KEY_ID"].strip()
          raw = os.environ["APP_STORE_CONNECT_PRIVATE_KEY"]
          text = raw.strip().replace("\\n", "\n")
          if "BEGIN PRIVATE KEY" not in text:
              try:
                  text = base64.b64decode(text).decode("utf-8")
              except Exception:
                  print("ERROR: APP_STORE_CONNECT_PRIVATE_KEY is not a PEM or base64 .p8")
                  sys.exit(1)
          body = text.replace("-----BEGIN PRIVATE KEY-----", "").replace("-----END PRIVATE KEY-----", "")
          body = re.sub(r"\s+", "", body)
          if len(body) < 80:
              print("ERROR: APP_STORE_CONNECT_PRIVATE_KEY is too short; re-paste the full .p8 file")
              sys.exit(1)
          lines = [body[i:i+64] for i in range(0, len(body), 64)]
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n"
          homes = [
              pathlib.Path.home() / ".appstoreconnect" / "private_keys",
              pathlib.Path.home() / ".private_keys",
          ]
          for folder in homes:
              folder.mkdir(parents=True, exist_ok=True)
              (folder / f"AuthKey_{key_id}.p8").write_text(pem, encoding="utf-8")
          PY
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
