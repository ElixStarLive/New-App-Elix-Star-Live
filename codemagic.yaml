# NEW app iOS — Codemagic only (no local Xcode on Windows).
# Bundle: com.elixstarlive.app · Team: 74Y7WAZVUV
# Capacitor 8 SPM project: ios/App/App.xcodeproj (no CocoaPods workspace).
# Signing / TestFlight: Codemagic iOS signing + group app_store_credentials.

workflows:
  ios-unsigned:
    name: iOS compile check (unsigned)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web + sync Capacitor iOS
        script: npm run build:ios
      - name: Xcode build (no signing)
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log

  ios-signed-ipa:
    name: iOS signed IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.elixstarlive.app
      node: 22
      xcode: latest
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.elixstarlive.app
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web + sync Capacitor iOS
        script: npm run build:ios
      - name: Set up keychain + code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles --code-signing-setup-verbose-logging
      - name: Increment iOS build number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER))
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist /Users/builder/export_options.plist \
            --archive-flags="-destination 'generic/platform=iOS' CODE_SIGN_IDENTITY='Apple Distribution' CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=74Y7WAZVUV"
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.elixstarlive.app
      groups:
        - app_store_credentials
      node: 22
      xcode: latest
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.elixstarlive.app
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web + sync Capacitor iOS
        script: npm run build:ios
      - name: Set up keychain + code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles --code-signing-setup-verbose-logging
      - name: Increment iOS build number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER))
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist /Users/builder/export_options.plist \
            --archive-flags="-destination 'generic/platform=iOS' CODE_SIGN_IDENTITY='Apple Distribution' CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=74Y7WAZVUV"
      - name: Upload IPA to TestFlight
        script: |
          set -e
          IPA_PATH="$(ls build/ios/ipa/*.ipa ios/App/build/ios/ipa/*.ipa 2>/dev/null | head -n 1)"
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA found"
            exit 1
          fi
          app-store-connect publish --path "$IPA_PATH"
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
